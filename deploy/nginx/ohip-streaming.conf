# Nginx do OHIP Streaming (ADR-0020 §5). Modelo: incluir no bloco http (conf.d/).
# AJUSTAR: server_name, certificados, rede de monitoramento e o login do painel (Q-5).
# Segredos ficam fora do repositório: /etc/nginx/ohip/*.conf (0640 root:nginx).

upstream ohip_api {
    server 127.0.0.1:8080;  # ohip-api (API_HOST/API_PORT)
    keepalive 16;
}

upstream ohip_admin {
    server 127.0.0.1:8081;  # ohip-admin (ADMIN_HOST/ADMIN_PORT)
    keepalive 8;
}

# Grupo do usuário do painel. Q-5: com SSO, o grupo vem do provedor (auth_request).
# Arquivo com linhas "usuario ohip-admin;" ou "usuario ohip-read;". Quem não estiver nele
# fica sem grupo e leva 403 no painel (ADR-0018): autenticar não basta para ler.
map $remote_user $ohip_groups {
    default "";
    include /etc/nginx/ohip/groups.map;
}

# Log sem query string (filtros de busca podem ter dados pessoais).
log_format ohip_sem_query '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                          '$request_time "$http_user_agent" $request_id';

server {
    listen 80;
    server_name ohip.exemplo.interno;  # AJUSTAR
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ohip.exemplo.interno;  # AJUSTAR

    ssl_certificate     /etc/nginx/tls/ohip.crt;  # AJUSTAR
    ssl_certificate_key /etc/nginx/tls/ohip.key;  # AJUSTAR
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ohip_tls:10m;

    server_tokens off;
    client_max_body_size 64k;  # a API só recebe JSON pequeno (replay, retry)
    access_log /var/log/nginx/ohip_access.log ohip_sem_query;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- Endpoints internos: só a rede de monitoramento (sem token, ADR-0017).
    location = /health {
        allow 127.0.0.1;
        allow 10.0.0.0/24;  # AJUSTAR: Prometheus/monitoramento
        deny all;
        proxy_pass http://ohip_api;
    }
    location = /ready {
        allow 127.0.0.1;
        allow 10.0.0.0/24;  # AJUSTAR
        deny all;
        proxy_pass http://ohip_api;
    }
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/24;  # AJUSTAR
        deny all;
        proxy_pass http://ohip_api;
    }

    # OpenAPI: desligado em produção na API e bloqueado aqui de todo modo.
    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }

    # --- API de controle: autenticação por token de serviço (Authorization), feita pela API.
    location /api/ {
        proxy_pass http://ohip_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Na API a identidade vem do token; headers de identidade do painel são apagados.
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Groups "";
        proxy_set_header X-Admin-Proxy-Secret "";
        proxy_read_timeout 30s;
    }

    # --- Painel: login no Nginx (Q-5). Exemplo com auth_basic; trocar pelo SSO.
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        auth_basic "OHIP Streaming";
        auth_basic_user_file /etc/nginx/ohip/htpasswd;  # AJUSTAR (Q-5)

        proxy_pass http://ohip_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Identidade SEMPRE sobrescrita aqui: o que o cliente mandar nesses headers é descartado.
        proxy_set_header X-Forwarded-User $remote_user;
        proxy_set_header X-Forwarded-Groups $ohip_groups;
        # Segredo compartilhado Nginx → painel (ADMIN_PROXY_SECRET, ADR-0018): arquivo com
        #   proxy_set_header X-Admin-Proxy-Secret "<segredo de 32+ caracteres>";
        include /etc/nginx/ohip/admin-proxy-secret.conf;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
